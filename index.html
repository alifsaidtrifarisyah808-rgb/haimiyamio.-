<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Haimiya Mio</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #050810;
    color: white;
}

/* BACKGROUND */
.background-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -3;
}

.background-overlay {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(
            rgba(3,8,18,.78),
            rgba(3,8,18,.95)
        );
    z-index: -2;
}

/* HEADER */

header {
    position: sticky;
    top: 0;
    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 18px 5%;

    background: rgba(4,8,18,.88);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(120,190,255,.15);
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: white;
}

.logo span {
    color: #55aaff;
}

.search {
    width: 330px;
    max-width: 48%;

    padding: 13px 18px;

    border-radius: 15px;

    border: 1px solid rgba(100,180,255,.3);

    background: rgba(15,22,38,.9);

    color: white;

    outline: none;

    font-size: 15px;
}

.search::placeholder {
    color: #8994a8;
}

/* CONTAINER */

.container {
    width: 92%;
    max-width: 1100px;
    margin: auto;
}

/* HERO */

.hero {
    min-height: 400px;

    margin-top: 30px;

    padding: 60px;

    display: flex;
    align-items: center;

    border-radius: 28px;

    background:
        linear-gradient(
            90deg,
            rgba(3,8,18,.95),
            rgba(3,8,18,.55),
            rgba(3,8,18,.2)
        );

    border: 1px solid rgba(100,180,255,.12);

    overflow: hidden;
}

.hero small {
    color: #65b5ff;

    font-size: 14px;

    letter-spacing: 5px;

    font-weight: bold;
}

.hero h1 {
    font-size: clamp(42px, 8vw, 72px);

    margin-top: 15px;

    color: white;
}

.developer {
    margin-top: 18px;

    color: #d5e8ff;

    font-size: 18px;
}

.developer span {
    color: #61b2ff;
}

/* SECTION */

.section-title {
    margin-top: 55px;
    margin-bottom: 20px;

    font-size: 30px;
}

/* FILTER */

.filters {
    display: flex;
    gap: 10px;

    margin-bottom: 22px;
}

.filter {
    padding: 10px 20px;

    border-radius: 50px;

    border: 1px solid rgba(100,180,255,.3);

    background: rgba(12,20,35,.9);

    color: #dcecff;
}

.filter.active {
    background: white;
    color: #07101d;
}

/* VIDEO GRID */

.video-grid {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 18px;

    padding-bottom: 70px;
}

/* CARD */

.video-card {
    background: rgba(9,15,27,.95);

    border-radius: 20px;

    overflow: hidden;

    border: 1px solid rgba(120,190,255,.12);

    cursor: pointer;

    transition: .2s;
}

.video-card:hover {
    transform: translateY(-4px);

    border-color: #55aaff;
}

/* THUMBNAIL */

.thumbnail {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    overflow: hidden;

    background: #111827;
}

.thumbnail img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    opacity: .85;
}

.play-button {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 60px;
    height: 60px;

    border-radius: 50%;

    background: white;

    color: #101827;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 25px;

    padding-left: 4px;
}

/* VIDEO TITLE */

.video-info {
    padding: 16px;
}

.video-title {
    font-size: 18px;

    font-weight: bold;

    color: white;
}

/* WATCH PAGE */

.watch-page {
    display: none;

    padding-top: 30px;

    padding-bottom: 80px;
}

.back-button {
    display: inline-block;

    margin-bottom: 20px;

    color: #9dccff;

    cursor: pointer;

    font-size: 18px;
}

/* PLAYER */

.video-player {
    width: 100%;

    aspect-ratio: 16 / 9;

    background: black;

    border-radius: 22px;

    overflow: hidden;

    border: 1px solid rgba(100,180,255,.3);
}

.video-player video {
    width: 100%;
    height: 100%;

    object-fit: contain;

    background: black;
}

.watch-title {
    margin-top: 25px;

    font-size: clamp(28px, 6vw, 45px);
}

/* MOBILE */

@media(max-width: 650px) {

    header {
        padding: 14px 4%;
    }

    .logo {
        font-size: 22px;
    }

    .search {
        width: 50%;
        max-width: none;
    }

    .hero {
        min-height: 350px;

        padding: 40px 30px;
    }

    .video-grid {
        gap: 12px;
    }

    .video-info {
        padding: 12px;
    }

    .video-title {
        font-size: 15px;
    }

    .play-button {
        width: 52px;
        height: 52px;
        font-size: 21px;
    }
}

</style>
<style>
.background-photo{
  position:fixed;
  inset:0;
  background-image:url("5ff50efece7c18d8234f4f1c42a4b52f.jpg");
  background-size:cover;
  background-position:center;
  z-index:-2;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}
    
</head>

<body>

<!-- BACKGROUND VIDEO -->

<div class="background-photo"></div>
<div class="overlay"></div>

<div class="video-banner">
  <video autoplay muted loop playsinline>
    <source src="NAMA_VIDEO_KAMU.mp4" type="video/mp4">
  </video>
</div>
    
<!-- HEADER -->

<header>

    <div class="logo">
        Haimiya <span>Mio</span>
    </div>

    <input
        class="search"
        id="search"
        type="search"
        placeholder="Cari video..."
    >

</header>


<main class="container">

<!-- ================= HOME ================= -->

<section id="home">

    <div class="hero">

        <div>

            <small>
                SELAMAT DATANG DI
            </small>

            <h1>
                Haimiya Mio
            </h1>

            <p class="developer">
                develop by - <span>Alif</span>
            </p>

        </div>

    </div>


    <h2 class="section-title">
        Video Terbaru
    </h2>


    <div class="filters">

        <button class="filter active">
            Semua
        </button>

    </div>


    <div
        class="video-grid"
        id="videoGrid">
    </div>

</section>



<!-- ================= WATCH VIDEO ================= -->

<section
    class="watch-page"
    id="watchPage">

    <div
        class="back-button"
        onclick="goHome()">

        ← Kembali

    </div>


    <div class="video-player">

        <video
            id="mainVideo"
            controls
            playsinline>

            <source
                id="videoSource"
                src=""
                type="video/mp4">

        </video>

    </div>


    <h1
        class="watch-title"
        id="watchTitle">

    </h1>

</section>

</main>



<script>

/*
====================================================
DAFTAR VIDEO
====================================================

Kalau mau menambah video:

1. Upload video ke repository GitHub
2. Tambahkan data baru di bawah

Contoh:

{
    title: "Video Baru",
    file: "video5.mp4",
    image: "thumbnail5.jpg"
}

====================================================
*/

const videos = [

    {
        title: "Video Pertama",
        file: "video1.mp4",
        image: "anime-bg.png"
    },

    {
        title: "Video Kedua",
        file: "video2.mp4",
        image: "anime-bg.png"
    },

    {
        title: "Video Ketiga",
        file: "video3.mp4",
        image: "anime-bg.png"
    },

    {
        title: "Video Keempat",
        file: "video4.mp4",
        image: "anime-bg.png"
    }

];



const grid =
    document.getElementById("videoGrid");


/* MENAMPILKAN VIDEO */

function displayVideos(list) {

    grid.innerHTML = "";


    list.forEach((video, index) => {

        const card =
            document.createElement("div");

        card.className =
            "video-card";


        card.innerHTML = `

            <div class="thumbnail">

                <img
                    src="${video.image}"
                    alt="${video.title}"
                >

                <div class="play-button">
                    ▶
                </div>

            </div>

            <div class="video-info">

                <div class="video-title">
                    ${video.title}
                </div>

            </div>

        `;


        card.onclick = function() {

            openVideo(index);

        };


        grid.appendChild(card);

    });

}



/* BUKA VIDEO */

function openVideo(index) {

    const video =
        videos[index];


    document.getElementById("home")
        .style.display = "none";


    document.getElementById("watchPage")
        .style.display = "block";


    document.getElementById("watchTitle")
        .textContent = video.title;


    const player =
        document.getElementById("mainVideo");


    const source =
        document.getElementById("videoSource");


    source.src =
        video.file;


    player.load();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* KEMBALI */

function goHome() {

    const player =
        document.getElementById("mainVideo");


    player.pause();


    document.getElementById("watchPage")
        .style.display = "none";


    document.getElementById("home")
        .style.display = "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* SEARCH */

document
    .getElementById("search")
    .addEventListener("input", function() {

        const keyword =
            this.value.toLowerCase();


        const filtered =
            videos.filter(video =>
                video.title
                    .toLowerCase()
                    .includes(keyword)
            );


        displayVideos(filtered);

    });



/* TAMPILKAN VIDEO */

displayVideos(videos);

</script>

</body>
</html>
