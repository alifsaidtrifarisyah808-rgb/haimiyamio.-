<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Haimiya Mio</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#050914;
  color:white;
  min-height:100vh;
}

/* BACKGROUND FOTO */
.background-photo{
  position:fixed;
  inset:0;
  background-image:url("5ff50efece7c18d8234f4f1c42a4b52f.jpg");
  background-size:cover;
  background-position:center;
  z-index:-2;
}

/* LAPISAN GELAP */
.page-overlay{
  position:fixed;
  inset:0;
  background:rgba(3,8,20,.78);
  z-index:-1;
}

/* HEADER */
header{
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(5,9,20,.85);
  border-bottom:1px solid #19385f;
}

.logo{
  font-size:24px;
  font-weight:800;
  color:white;
}

.logo span{
  color:#2f8cff;
}

.search{
  background:#101a2c;
  border:1px solid #24466f;
  border-radius:22px;
  padding:10px 15px;
  color:white;
  width:180px;
  outline:none;
}

/* BAGIAN ATAS */
.hero{
  padding:35px 6% 25px;
  max-width:850px;
}

.hero small{
  color:#55a5ff;
  font-weight:bold;
}

.hero h1{
  font-size:48px;
  margin:10px 0;
}

.hero p{
  color:#b8c3d5;
  margin-top:10px;
}

.credit{
  margin-top:15px;
  color:#8dbdff;
}

/* BANNER VIDEO 16:9 */
.banner{
  width:88%;
  max-width:1100px;
  margin:10px auto 30px;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:14px;
  border:1px solid #28598e;
  background:#000;
  box-shadow:0 10px 35px rgba(0,0,0,.45);
}

.banner video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* VIDEO */
.section{
  padding:10px 5% 50px;
}

.section h2{
  margin-bottom:18px;
}

/* KATEGORI */
.categories{
  display:flex;
  gap:10px;
  margin-bottom:22px;
  flex-wrap:wrap;
}

.category{
  border:none;
  padding:9px 18px;
  border-radius:20px;
  background:#101a2c;
  border:1px solid #28598e;
  color:white;
  cursor:pointer;
}

.category.active{
  background:#1677ff;
  border-color:#1677ff;
}

/* LIST VIDEO */
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

/* VIDEO TANPA THUMBNAIL */
.card{
  background:rgba(12,21,38,.94);
  border:1px solid #1d385d;
  border-radius:12px;
  padding:18px;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#3191ff;
}

.card h3{
  font-size:16px;
  color:white;
}

/* HALAMAN NONTON */
.watch{
  display:none;
  padding:25px 5% 50px;
}

.back{
  border:0;
  background:#1677ff;
  color:white;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
  margin-bottom:20px;
}

.player{
  width:100%;
  max-height:70vh;
  background:#000;
  border-radius:12px;
}

.watch h2{
  margin:15px 0;
}

/* HP */
@media(max-width:600px){

  .hero h1{
    font-size:38px;
  }

  .search{
    width:145px;
  }

  .grid{
    gap:10px;
  }

  .card{
    padding:14px;
  }

  .banner{
    width:92%;
  }
}
</style>
</head>

<body>

<!-- FOTO BACKGROUND -->
<div class="background-photo"></div>
<div class="page-overlay"></div>


<!-- HEADER -->
<header>

  <div class="logo">
    Haimiya <span>Mio</span>
  </div>

  <input
    class="search"
    id="search"
    placeholder="Cari video..."
  >

</header>


<!-- HALAMAN UTAMA -->
<main id="home">

  <!-- JUDUL + DESKRIPSI -->
  <section class="hero">

    <small>SELAMAT DATANG DI</small>

    <h1>Haimiya Mio</h1>

    <p>
      Tempat menonton video favoritmu dengan tampilan
      sederhana dan nyaman.
    </p>

    <div class="credit">
      develop by - Alif
    </div>

  </section>


  <!-- BANNER VIDEO 16:9 -->
  <div class="banner">

    <video
      autoplay
      muted
      loop
      playsinline
    >

      <source
        src="VID_20261015_100741.mp4"
        type="video/mp4"
      >

    </video>

  </div>


  <!-- DAFTAR VIDEO -->
  <section class="section">

    <h2>Video Terbaru</h2>


    <!-- KATEGORI -->
    <div class="categories">

      <button
        class="category active"
        onclick="filterCategory('Semua',this)"
      >
        Semua
      </button>

      <button
        class="category"
        onclick="filterCategory('Asia',this)"
      >
        Asia
      </button>

      <button
        class="category"
        onclick="filterCategory('Barat',this)"
      >
        Barat
      </button>

    </div>


    <!-- VIDEO -->
    <div
      class="grid"
      id="grid"
    ></div>

  </section>

</main>


<!-- HALAMAN NONTON -->
<section
  class="watch"
  id="watch"
>

  <button
    class="back"
    onclick="closeWatch()"
  >
    ← Kembali
  </button>

  <video
    class="player"
    id="player"
    controls
  ></video>

  <h2 id="watchTitle"></h2>

</section>


<script>

/* DAFTAR VIDEO */
const videos = [

  {
    title:"Video Asia",
    category:"Asia",
    file:"c38gI01zU.mp4"
  },

  {
    title:"Video Asia 2",
    category:"Asia",
    file:"video2.mp4"
  },

  {
    title:"Video Barat 1",
    category:"Barat",
    file:"video3.mp4"
  },

  {
    title:"Video Barat 2",
    category:"Barat",
    file:"video4.mp4"
  }

];


const grid =
  document.getElementById("grid");

const search =
  document.getElementById("search");


/* MENAMPILKAN VIDEO */
function render(list){

  grid.innerHTML="";

  list.forEach(v=>{

    const card =
      document.createElement("div");

    card.className="card";

    card.innerHTML=`
      <h3>${v.title}</h3>
    `;

    card.onclick=()=>{
      openWatch(v);
    };

    grid.appendChild(card);

  });

}


/* FILTER KATEGORI */
function filterCategory(category,button){

  document
    .querySelectorAll(".category")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  button.classList.add("active");

  const keyword =
    search.value.toLowerCase();

  let result;

  if(category==="Semua"){

    result=videos;

  }else{

    result=
      videos.filter(v=>
        v.category===category
      );

  }

  if(keyword){

    result=
      result.filter(v=>
        v.title
          .toLowerCase()
          .includes(keyword)
      );

  }

  render(result);

}


/* SEARCH */
search.addEventListener(
  "input",
  ()=>{

    const keyword =
      search.value.toLowerCase();

    const result =
      videos.filter(v=>
        v.title
          .toLowerCase()
          .includes(keyword)
      );

    render(result);

  }
);


/* BUKA VIDEO */
function openWatch(v){

  document
    .getElementById("home")
    .style.display="none";

  document
    .getElementById("watch")
    .style.display="block";

  document
    .getElementById("watchTitle")
    .textContent=v.title;

  const player =
    document.getElementById("player");

  player.src=v.file;

  window.scrollTo(0,0);

}


/* KEMBALI */
function closeWatch(){

  const player =
    document.getElementById("player");

  player.pause();

  player.src="";

  document
    .getElementById("watch")
    .style.display="none";

  document
    .getElementById("home")
    .style.display="block";

  window.scrollTo(0,0);

}


/* TAMPILKAN SEMUA */
render(videos);

</script>

</body>
</html>
